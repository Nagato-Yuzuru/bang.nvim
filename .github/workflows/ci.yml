name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so a Neovim nightly change shows up within a day rather than on the
  # next unrelated pull request.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - run: mise run lint
      - run: mise run docs

  test:
    name: test (Neovim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a pull request nightly reports but never blocks; on the daily run a
    # nightly failure fails the run, which is what sends the notification.
    continue-on-error: ${{ matrix.neovim == 'nightly' && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.11.0, stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Cache the test harness (mini.nvim at the pinned tag)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ hashFiles('tests/minimal_init.lua') }}
      - id: test
        run: mise run test
      # The version that ran, so "stable" and "nightly" show as their numbers.
      - name: Record the result for the badge
        if: always()
        env:
          OUTCOME: ${{ steps.test.outcome }}
          KEY: ${{ matrix.neovim }}
        run: |
          version=$(nvim --version 2>/dev/null | head -n 1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-dev)?' || echo "$KEY")
          mkdir -p result
          jq -n --arg version "${version#v}" --arg outcome "$OUTCOME" \
            '{$version, ok: ($outcome == "success")}' > "result/$KEY.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.neovim }}
          path: result/

  # The README badge reads neovim.json from the orphan `badges` branch. Only
  # scheduled and manually dispatched runs on main write it.
  badges:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          merge-multiple: true
          path: result
      # A shields.io endpoint file: the versions in order, a failed one
      # marked, red when any failed.
      - run: |
          for result in v0.11.0 stable nightly; do
            if [ ! -f "result/$result.json" ]; then
              echo "Missing result/$result.json" >&2
              exit 1
            fi
          done
          mkdir badges
          jq -s '{
            schemaVersion: 1,
            label: "Neovim",
            message: (sort_by(.version | [scan("[0-9]+") | tonumber])
              | map(.version + (if .ok then "" else " ✗" end)) | join(" · ")),
            color: (if all(.ok) then "brightgreen" else "red" end)
          }' result/*.json > badges/neovim.json
      # One commit, force-pushed, so the branch does not grow every day.
      - working-directory: badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git add .
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore: version badge from run $GITHUB_RUN_ID"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" badges
