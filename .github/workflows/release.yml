name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff walks the history back to the previous tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      # The notes come from the commit subjects, grouped by cliff.toml, as a
      # draft: read, edit and publish by hand.
      - run: git cliff --latest --output notes.md
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
