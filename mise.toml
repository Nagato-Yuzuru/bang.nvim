[tools]
actionlint = "1.7.12"
# selene ships an arm64-only macOS binary; on macOS mise builds it with cargo instead.
"aqua:Kampfkarren/selene" = { version = "0.31.0", os = ["linux", "windows"] }
"cargo:selene" = { version = "0.31.0", os = ["macos"] }
dprint = "0.57.4"
prek = "0.5.2"
stylua = "2.5.2"

[tasks.test]
description = "Run the mini.test suite headless (exit 1 on any failure)"
run = "nvim --headless --noplugin -u tests/minimal_init.lua -c 'lua MiniTest.run()'"

[tasks.docs]
description = "Regenerate doc/tags and fail on duplicate or malformed help tags"
run = '''nvim --headless --clean -c 'lua local ok, err = pcall(vim.cmd.helptags, "doc"); if not ok then io.stderr:write(err .. "\n"); os.exit(1) end' -c qa!'''

[tasks.lint]
description = "Run every fast check (formatters fix in place; exits 1 if anything changed or failed)"
run = "prek run --all-files --show-diff-on-failure"

[tasks.check]
depends = ["lint", "docs", "test"]
description = "Everything CI runs: lint, docs, test"

[tasks.demo]
description = "Re-render every demo GIF in demo/ from its tape (needs vhs, ttyd, ffmpeg)"
# screenkey.nvim draws the keys into the recording. Pinned to a commit: its last
# tag predates the option that keeps command-line typing out of the display.
run = '''
test -d .deps/screenkey.nvim || git clone --quiet --depth 1 https://github.com/NStefan002/screenkey.nvim .deps/screenkey.nvim
git -C .deps/screenkey.nvim fetch --quiet --depth 1 origin 740e238d1f143cb5f3a9d932f9c5142d3581b986
git -C .deps/screenkey.nvim checkout --quiet 740e238d1f143cb5f3a9d932f9c5142d3581b986
for t in demo/[a-z]*.tape; do vhs "$t"; done
'''
